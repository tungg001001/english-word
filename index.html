          phonetic: `/${prefixObj.pre}.${rootObj.root}.${suffix}/`,

        { affix: '-ment', meaning: '【名詞字尾】表行為、手段、結果', origin: 'Latin', examples: ['environment (環境)', 'development (發展)', 'agreement (協議)'] },
        { affix: '-ity / -ty', meaning: '【名詞字尾】表性質、狀態、程度', origin: 'Latin', examples: ['biodiversity (生物多樣性)', 'hospitality (好客)', 'ability (能力)'] },
        { affix: '-sis', meaning: '【名詞字尾】表過程、狀態（多為希臘語源）', origin: 'Greek', examples: ['hypothesis (假設)', 'analysis (分析)', 'crisis (危機)'] },
        { affix: '-pathy', meaning: '【名詞字尾】表感情、疾病', origin: 'Greek', examples: ['empathy (同理心)', 'telepathy (心電感應)'] },
        { affix: '-able / -ible', meaning: '【形容詞字尾】能夠...的、值得...的', origin: 'Latin', examples: ['sustainable (永續的)', 'credible (可信的)', 'portable (可攜帶的)'] },
        { affix: '-ive', meaning: '【形容詞字尾】有...傾向的、具有...性質的', origin: 'Latin', examples: ['creative (有創意的)', 'active (積極的)', 'effective (有效的)'] },
        { affix: '-ic / -tic', meaning: '【形容詞字尾】...的、與...相關的', origin: 'Greek/Latin', examples: ['optimistic (樂觀的)', 'scientific (科學的)', 'energetic (精力充沛的)'] },
        { affix: '-al / -ial', meaning: '【形容詞字尾】屬於...的、具有...性質的', origin: 'Latin', examples: ['artificial (人工的)', 'natural (自然的)', 'global (全球的)'] },
        { affix: '-ent / -ant', meaning: '【形容詞/名詞字尾】處於...狀態的；執行者', origin: 'Latin', examples: ['resilient (有韌性的)', 'student (學生)', 'different (不同的)'] },
        { affix: '-ate', meaning: '【動詞字尾】使成為、做...動作', origin: 'Latin', examples: ['innovate (創新)', 'collaborate (合作)', 'create (創造)'] },
        { affix: '-ize / -ise', meaning: '【動詞字尾】使...化、實踐', origin: 'Greek', examples: ['realize (實現/了解)', 'organize (組織)', 'modernize (現代化)'] }
      ]
    };

    // ==========================================
    // 2. Main React App Component

    function App() {

        } catch (e) {}
      }, [favorites]);

          localStorage.setItem('vocab_master_mastered', JSON.stringify(mastered));

      // Lucide icons render trigger
      useEffect(() => {

          window.lucide.createIcons();
        }
      });

      // Custom non-blocking notification toast
      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000);
      };

      // Universal Text to Speech function for any English string
      const speakText = (text, rate = 1) => {
        if (!text) return;
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'en-US';
          utterance.rate = rate;
          window.speechSynthesis.speak(utterance);
        } else {
          showToast('您的瀏覽器不支援語音合成朗讀功能。');
        }
      };

      // Filtered Vocabulary List
      const filteredVocabulary = useMemo(() => {
        return VOCABULARY_DATA.filter(item => {
          const matchesSearch = item.word.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                item.meaning.includes(searchTerm) ||
                                item.rootBreakdown.toLowerCase().includes(searchTerm.toLowerCase());
          const matchesTheme = selectedTheme === 'All' || item.theme === selectedTheme;
          const matchesPOS = selectedPOS === 'All' || item.partOfSpeech.toLowerCase().includes(selectedPOS.toLowerCase());
          return matchesSearch && matchesTheme && matchesPOS;
        });
      }, [searchTerm, selectedTheme, selectedPOS]);

      const currentWord = filteredVocabulary[currentIndex] || filteredVocabulary[0] || VOCABULARY_DATA[0];

      // Jump from Affix list to Dictionary filtered by that affix

        setSearchTerm(cleanTerm);

        setSelectedPOS('All');

          prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]

      };

      // Flashcard Navigation
      const nextCard = () => {
        if (filteredVocabulary.length === 0) return;
        setIsFlipped(false);
        setCurrentIndex(prev => (prev + 1) % filteredVocabulary.length);

        setCurrentIndex(prev => (prev - 1 + filteredVocabulary.length) % filteredVocabulary.length);

          if (!options.includes(randomItem.meaning)) {
            options.push(randomItem.meaning);
          }
        }
        return options.sort(() => Math.random() - 0.5);

        setQuizAnswered(true);

                        <span>翻轉卡片</span>
                      </button>
                      <button
                        onClick={nextCard}
                        className="flex items-center space-x-2 px-5 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-xl shadow-md shadow-indigo-200 transition"
                      >
                        <span>下一個</span>
                        <i data-lucide="chevron-right" className="w-4 h-4"></i>
                      </button>
                    </div>
                  </>
                ) : (
                  <div className="bg-white rounded-2xl p-10 text-center border border-slate-100 shadow-sm w-full">
                    <p className="text-slate-500 text-sm">此分類目前沒有符合的單字。</p>
                  </div>
                )}
              </div>
            )}

            {/* TAB 2: DICTIONARY SEARCH */}
            {currentTab === 'dictionary' && (
              <div className="max-w-6xl mx-auto">
                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 mb-6 flex flex-col md:flex-row gap-3 items-center justify-between">
                  <div className="relative w-full md:w-80">
                    <i data-lucide="search" className="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                    <input
                      type="text"
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      placeholder="搜尋英文單字、中文釋義或字根..."
                      className="w-full pl-10 pr-8 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                    {searchTerm && (
                      <button
                        onClick={() => setSearchTerm('')}
                        className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
                        title="清除搜尋"
                      >
                        <i data-lucide="x" className="w-4 h-4"></i>
                      </button>
                    )}
                  </div>

                  <div className="flex flex-wrap gap-2 w-full md:w-auto">
                    <select
                      value={selectedTheme}
                      onChange={(e) => setSelectedTheme(e.target.value)}
                      className="text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                      <option value="All">所有主題</option>
                      <option value="School & Study">學校與學習</option>
                      <option value="Environment & Nature">環境與自然</option>
                      <option value="Emotion & Feeling">情感與性格</option>
                      <option value="Business & Work">職場與商務</option>
                      <option value="Technology & Science">科技與科學</option>
                      <option value="Daily Life & Society">日常與社會</option>
                    </select>

                    <select
                      value={selectedPOS}
                      onChange={(e) => setSelectedPOS(e.target.value)}
                      className="text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                      <option value="All">所有詞性</option>
                      <option value="noun">名詞 (noun)</option>
                      <option value="verb">動詞 (verb)</option>
                      <option value="adjective">形容詞 (adjective)</option>
                    </select>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {filteredVocabulary.slice(0, 90).map((item) => (
                    <div key={item.id} className="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                      <div>
                        <div className="flex items-start justify-between mb-1">
                          <div>
                            <div className="flex items-center gap-2">
                              <h3 className="text-lg font-bold text-slate-900">{item.word}</h3>
                              <button
                                onClick={() => speakText(item.word)}
                                className="text-indigo-600 hover:bg-indigo-50 p-1 rounded-full transition"
                                title="發音"
                              >
                                <i data-lucide="volume-2" className="w-4 h-4"></i>
                              </button>
                            </div>
                            <p className="text-xs font-mono text-slate-400">{item.phonetic} · <span className="text-indigo-500 font-sans font-semibold">{item.partOfSpeech}</span></p>
                          </div>
                          <button
                            onClick={() => toggleFavorite(item.id)}
                            className={`p-1.5 rounded-full transition ${favorites.includes(item.id) ? 'text-amber-500 bg-amber-50' : 'text-slate-300 hover:text-amber-500'}`}
                          >
                            <i data-lucide="star" className="w-4 h-4 fill-current"></i>
                          </button>
                        </div>

                        <p className="text-sm font-bold text-slate-800 mt-2 mb-1">{item.meaning}</p>
                        <p className="text-xs text-slate-500 bg-slate-50 px-2.5 py-1.5 rounded-lg mb-2">
                          {item.rootBreakdown}
                        </p>
                      </div>

                      <div className="pt-2 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
                        <span>{item.theme}</span>
                        <button
                          onClick={() => toggleMastered(item.id)}
                          className={`font-semibold transition ${mastered.includes(item.id) ? 'text-emerald-600' : 'text-slate-400 hover:text-emerald-600'}`}
                        >
                          {mastered.includes(item.id) ? '✓ 已熟練' : '標記熟練'}
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
                {filteredVocabulary.length > 90 && (
                  <p className="text-center text-xs text-slate-400 mt-6">
                    僅顯示前 90 筆結果（共 {filteredVocabulary.length} 筆），請使用上方搜尋框縮小範圍。
                  </p>
                )}
              </div>
            )}

            {/* TAB 3: PREFIXES, ROOTS & SUFFIXES (NEWLY ADDED) */}
            {currentTab === 'affixes' && (
              <div className="max-w-6xl mx-auto">
                {/* Top Control Bar */}
                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
                  {/* Category Filter Pills */}
                  <div className="flex flex-wrap gap-2">
                    {[
                      { id: 'all', label: `全部詞素 (${AFFIX_DATA.prefixes.length + AFFIX_DATA.roots.length + AFFIX_DATA.suffixes.length})` },
                      { id: 'prefixes', label: `字首 Prefixes (${AFFIX_DATA.prefixes.length})` },
                      { id: 'roots', label: `字根 Roots (${AFFIX_DATA.roots.length})` },
                      { id: 'suffixes', label: `字尾 Suffixes (${AFFIX_DATA.suffixes.length})` }
                    ].map(tab => (
                      <button
                        key={tab.id}
                        onClick={() => setAffixCategory(tab.id)}
                        className={`px-3.5 py-2 rounded-xl text-xs font-bold transition ${
                          affixCategory === tab.id
                            ? 'bg-indigo-600 text-white shadow-sm'
                            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                        }`}
                      >
                        {tab.label}
                      </button>
                    ))}
                  </div>

                  {/* Search Box */}
                  <div className="relative w-full md:w-72">
                    <i data-lucide="search" className="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                    <input
                      type="text"
                      value={affixSearch}
                      onChange={(e) => setAffixSearch(e.target.value)}
                      placeholder="搜尋字首、字根、字尾或中文意思..."
                      className="w-full pl-9 pr-8 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                    {affixSearch && (
                      <button
                        onClick={() => setAffixSearch('')}
                        className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
                      >
                        <i data-lucide="x" className="w-3.5 h-3.5"></i>
                      </button>
                    )}
                  </div>
                </div>

                {/* Sections Renderer */}
                {[
                  { key: 'prefixes', title: '字首 (Prefixes) — 決定單字的方向、時間或否定意味', badgeColor: 'bg-emerald-100 text-emerald-700', items: AFFIX_DATA.prefixes },
                  { key: 'roots', title: '字根 (Roots) — 決定單字的核心基本意義', badgeColor: 'bg-indigo-100 text-indigo-700', items: AFFIX_DATA.roots },
                  { key: 'suffixes', title: '字尾 (Suffixes) — 決定單字的詞性（名詞、形容詞、動詞）', badgeColor: 'bg-amber-100 text-amber-700', items: AFFIX_DATA.suffixes }
                ]
                  .filter(section => affixCategory === 'all' || affixCategory === section.key)
                  .map(section => {
                    const filteredItems = section.items.filter(item =>
                      item.affix.toLowerCase().includes(affixSearch.toLowerCase()) ||
                      item.meaning.includes(affixSearch) ||
                      item.examples.some(ex => ex.toLowerCase().includes(affixSearch.toLowerCase()))
                    );

                    if (filteredItems.length === 0) return null;

                    return (
                      <div key={section.key} className="mb-8">
                        <h2 className="text-base font-bold text-slate-800 mb-3 flex items-center gap-2">
                          <span className={`text-xs px-2.5 py-0.5 rounded-full ${section.badgeColor}`}>
                            {filteredItems.length} 項
                          </span>
                          <span>{section.title}</span>
                        </h2>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                          {filteredItems.map((item, idx) => (
                            <div key={idx} className="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                              <div>
                                <div className="flex items-center justify-between mb-2">
                                  <div className="flex items-center gap-2">
                                    <span className="text-lg font-extrabold text-indigo-600 font-mono">
                                      {item.affix}
                                    </span>
                                    <button
                                      onClick={() => speakText(item.affix.split('/')[0].replace(/-/g, ''))}
                                      className="p-1 text-slate-400 hover:text-indigo-600 rounded-full hover:bg-indigo-50 transition"
                                      title="朗讀發音"
                                    >
                                      <i data-lucide="volume-2" className="w-4 h-4"></i>
                                    </button>
                                  </div>
                                  <span className="text-[11px] font-medium text-slate-400 bg-slate-100 px-2 py-0.5 rounded">
                                    {item.origin}
                                  </span>
                                </div>

                                <p className="text-sm font-bold text-slate-800 mb-3">
                                  {item.meaning}
                                </p>

                                <div className="space-y-1.5 mb-4">
                                  <p className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">代表例字（點擊聽發音）：</p>
                                  <div className="flex flex-wrap gap-1.5">
                                    {item.examples.map((ex, i) => {
                                      const pureWord = ex.split(' ')[0];
                                      return (
                                        <button
                                          key={i}
                                          onClick={() => speakText(pureWord)}
                                          className="text-xs bg-slate-50 hover:bg-indigo-50 text-slate-700 hover:text-indigo-700 border border-slate-200 px-2 py-1 rounded-lg transition inline-flex items-center gap-1"
                                          title="點擊聽例字發音"
                                        >
                                          <span>{ex}</span>
                                        </button>
                                      );
                                    })}
                                  </div>
                                </div>
                              </div>

                              <button
                                onClick={() => searchRelatedWords(item.affix)}
                                className="w-full mt-2 py-2 px-3 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-semibold rounded-xl transition flex items-center justify-center gap-1.5"
                              >
                                <i data-lucide="search" className="w-3.5 h-3.5"></i>
                                <span>在單字庫中搜尋相關單字</span>
                              </button>
                            </div>
                          ))}
                        </div>
                      </div>
                    );
                  })}
              </div>
            )}

            {/* TAB 4: QUIZ CHALLENGE */}
            {currentTab === 'quiz' && (
              <div className="max-w-2xl mx-auto">
                <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 mb-6">
                  <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-100 pb-4 mb-6">
                    <div className="flex gap-2">
                      <button
                        onClick={() => { setQuizMode('mc'); setQuizAnswered(false); }}
                        className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${
                          quizMode === 'mc' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'
                        }`}
                      >
                        英翻中選擇題
                      </button>
                      <button
                        onClick={() => { setQuizMode('spelling'); setSpellingResult(null); }}
                        className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${
                          quizMode === 'spelling' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'
                        }`}
                      >
                        聽音拼寫測驗
                      </button>
                    </div>
                    <div className="text-sm font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">
                      目前得分：{quizScore} 分
                    </div>
                  </div>

                  {quizMode === 'mc' ? (
                    <div>
                      <div className="text-center mb-6">
                        <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">請選出正確的中文釋義</span>
                        <div className="flex items-center justify-center gap-2 mt-2">
                          <h2 className="text-3xl font-extrabold text-slate-900">{currentQuizWord.word}</h2>
                          <button
                            onClick={() => speakText(currentQuizWord.word)}
                            className="p-1.5 text-indigo-600 hover:bg-indigo-50 rounded-full transition"
                          >
                            <i data-lucide="volume-2" className="w-5 h-5"></i>
                          </button>
                        </div>
                        <p className="text-sm font-mono text-slate-400 mt-1">{currentQuizWord.phonetic}</p>
                      </div>

                      <div className="space-y-2.5">
                        {quizOptions.map((option, idx) => {
                          let btnStyle = 'bg-slate-50 hover:bg-slate-100 border-slate-200 text-slate-700';
                          if (quizAnswered) {
                            if (option === currentQuizWord.meaning) {
                              btnStyle = 'bg-emerald-50 border-emerald-500 text-emerald-800 font-bold';
                            } else if (option === selectedOption) {
                              btnStyle = 'bg-rose-50 border-rose-500 text-rose-800';
                            } else {
                              btnStyle = 'bg-slate-50 border-slate-100 text-slate-400 opacity-60';
                            }
                          }
                          return (
                            <button
                              key={idx}
                              onClick={() => handleAnswerQuiz(option)}
                              disabled={quizAnswered}
                              className={`w-full text-left px-4 py-3.5 rounded-xl border text-sm transition ${btnStyle}`}
                            >
                              {option}
                            </button>
                          );
                        })}
                      </div>

                      {quizAnswered && (
                        <div className="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between">
                          <span className="text-xs text-slate-500">字根：{currentQuizWord.rootBreakdown}</span>
                          <button
                            onClick={nextQuizQuestion}
                            className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl transition"
                          >
                            下一題 ➔
                          </button>
                        </div>
                      )}
                    </div>
                  ) : (
                    <div>
                      <div className="text-center mb-6">
                        <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">請根據提示拼出正確單字</span>
                        <h2 className="text-xl font-bold text-slate-900 mt-2">{currentQuizWord.meaning}</h2>
                        <p className="text-xs text-slate-500 mt-1">{currentQuizWord.rootBreakdown}</p>
                        <button
                          type="button"
                          onClick={() => speakText(currentQuizWord.word, 0.85)}
                          className="mt-3 inline-flex items-center gap-1.5 px-3.5 py-1.5 bg-indigo-50 text-indigo-700 rounded-full text-xs font-semibold hover:bg-indigo-100 transition"
                        >
                          <i data-lucide="volume-2" className="w-4 h-4"></i>
                          <span>聽發音提示</span>
                        </button>
                      </div>

                      <form onSubmit={handleSpellingSubmit} className="space-y-4">
                        <input
                          type="text"
                          value={userSpelling}
                          onChange={(e) => setUserSpelling(e.target.value)}
                          placeholder="請輸入英文單字..."
                          disabled={spellingResult !== null}
                          className="w-full text-center text-lg font-mono py-3 px-4 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        />
                        {spellingResult === null ? (
                          <button
                            type="submit"
                            className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl transition"
                          >
                            送出答案
                          </button>
                        ) : (
                          <div className={`p-4 rounded-xl text-center ${spellingResult ? 'bg-emerald-50 text-emerald-800' : 'bg-rose-50 text-rose-800'}`}>
                            <p className="font-bold text-sm mb-1">
                              {spellingResult ? '🎉 拼寫完全正確！(+15 分)' : `❌ 正確拼法為：${currentQuizWord.word}`}
                            </p>
                            <button
                              type="button"
                              onClick={nextQuizQuestion}
                              className="mt-2 px-5 py-2 bg-slate-900 text-white text-xs font-bold rounded-lg"
                            >
                              繼續下一題
                            </button>
                          </div>
                        )}
                      </form>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* TAB 5: STATS */}
            {currentTab === 'stats' && (
              <div className="max-w-4xl mx-auto">
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                  <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                    <p className="text-xs font-semibold text-slate-400">總字庫數量</p>
                    <p className="text-3xl font-extrabold text-slate-900 mt-1">{VOCABULARY_DATA.length}</p>
                  </div>
                  <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                    <p className="text-xs font-semibold text-slate-400">已標記熟練單字</p>
                    <p className="text-3xl font-extrabold text-emerald-600 mt-1">{mastered.length}</p>
                  </div>
                  <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                    <p className="text-xs font-semibold text-slate-400">星號收藏單字</p>
                    <p className="text-3xl font-extrabold text-amber-500 mt-1">{favorites.length}</p>
                  </div>
                </div>

                <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                  <h3 className="text-base font-bold text-slate-800 mb-4">我的星號收藏清單</h3>
                  {favorites.length === 0 ? (
                    <p className="text-xs text-slate-400">尚未收藏任何單字，可在卡片或單字庫點擊星號加入。</p>
                  ) : (
                    <div className="flex flex-wrap gap-2">
                      {VOCABULARY_DATA.filter(v => favorites.includes(v.id)).map(item => (
                        <span key={item.id} className="inline-flex items-center gap-2 bg-amber-50 text-amber-900 border border-amber-200 px-3 py-1.5 rounded-xl text-xs font-semibold">
                          <span>{item.word} ({item.meaning})</span>
                          <button onClick={() => speakText(item.word)} className="text-amber-600 hover:text-amber-800">
                            <i data-lucide="volume-2" className="w-3.5 h-3.5"></i>
                          </button>
                        </span>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
