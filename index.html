                const themeWords = vocabList.filter(w => w.theme === themeName);
                return (
                  <div key={themeName} className="bg-white rounded-2xl border border-slate-200 p-6 space-y-4 shadow-xs">
                    <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                      <h3 className="font-bold text-slate-900 text-base">{themeName}</h3>
                      <span className="px-2.5 py-1 bg-slate-100 text-slate-600 text-xs rounded-full font-medium">
                        {themeWords.length} 個單字
                      </span>
                    </div>

                    <div className="space-y-2.5 max-h-80 overflow-y-auto pr-1">
                      {themeWords.map((item) => (
                        <div key={item.id} className="p-2.5 bg-slate-50 rounded-xl flex items-center justify-between hover:bg-slate-100 transition-all">
                          <div>
                            <div className="flex items-center space-x-2">
                              <span className="font-bold text-slate-900 text-sm">{item.word}</span>
                              <span className="text-xs font-mono text-slate-400">{item.phonetic}</span>
                            </div>
                            <p className="text-xs text-slate-600 mt-0.5">{item.meaning}</p>
                          </div>
                          <button
                            onClick={() => speakWord(item.word)}
                            className="p-1.5 rounded-lg bg-white border border-slate-200 text-slate-500 hover:text-indigo-600 hover:border-indigo-200"
                          >
                            <i data-lucide="volume-2" className="w-3.5 h-3.5"></i>
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      // ==========================================
      // 模組 5: QuizAndMatchView (記憶測驗沙盒)
      // ==========================================
      function QuizAndMatchView({ vocabList, speakWord }) {
        const [quizIndex, setQuizIndex] = useState(0);
        const [selectedOption, setSelectedOption] = useState(null);
        const [score, setScore] = useState(0);
        const [showResult, setShowResult] = useState(false);

        const currentQuestion = vocabList[quizIndex % vocabList.length];

        const generateOptions = () => {
          if (!currentQuestion) return [];
          const correct = currentQuestion.meaning;
          const others = vocabList.filter(v => v.id !== currentQuestion.id).map(v => v.meaning);
          const shuffledOthers = [...others].sort(() => 0.5 - Math.random()).slice(0, 3);
          return [...shuffledOthers, correct].sort(() => 0.5 - Math.random());
        };

        const [options, setOptions] = useState(generateOptions());

        useEffect(() => {
          setOptions(generateOptions());
          setSelectedOption(null);
          setShowResult(false);
        }, [quizIndex, vocabList]);

        const handleSelectOption = (opt) => {
          setSelectedOption(opt);
          setShowResult(true);
          if (opt === currentQuestion.meaning) {
            setScore(prev => prev + 1);
          }
        };

        if (!currentQuestion) return null;

        return (
          <div className="max-w-xl mx-auto space-y-6">
            <div className="text-center space-y-2">
              <h2 className="text-2xl font-bold text-slate-900">單字記憶測驗 (100字挑戰)</h2>
              <p className="text-slate-600 text-sm">檢測對單字字義與音標的瞬間反應力</p>
            </div>

            <div className="bg-white rounded-2xl border border-slate-200 p-6 space-y-6 shadow-xs">
              <div className="flex justify-between items-center text-xs font-semibold text-slate-400">
                <span>答對題數：<strong className="text-emerald-600">{score}</strong> 題</span>
                <span>測驗進度：第 {quizIndex + 1} / {vocabList.length} 題</span>
              </div>

              <div className="text-center py-4 space-y-2">
                <span className="px-2.5 py-1 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-600">
                  {currentQuestion.partOfSpeech}
                </span>
                <h3 className="text-3xl font-extrabold text-slate-900">{currentQuestion.word}</h3>
                <p className="text-xs font-mono text-slate-400">{currentQuestion.phonetic}</p>
              </div>

              <div className="space-y-2.5">
                {options.map((opt, idx) => {
                  const isCorrect = opt === currentQuestion.meaning;
                  const isSelected = selectedOption === opt;

                  let btnStyle = 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100';
                  if (showResult) {
                    if (isCorrect) btnStyle = 'bg-emerald-500 text-white border-emerald-500 font-bold';
                    else if (isSelected) btnStyle = 'bg-rose-500 text-white border-rose-500';
                  }

                  return (
                    <button
                      key={idx}
                      disabled={showResult}
                      onClick={() => handleSelectOption(opt)}
                      className={`w-full p-3.5 rounded-xl border text-left text-sm transition-all ${btnStyle}`}
                    >
                      {opt}
                    </button>
                  );
                })}
              </div>

              {showResult && (
                <div className="pt-4 border-t border-slate-100 flex justify-between items-center">
                  <p className="text-xs text-slate-500">
                    {selectedOption === currentQuestion.meaning ? '🎉 答對了！大腦神經迴路加深。' : '❌ 答錯了，繼續加油！'}
                  </p>
                  <button
                    onClick={() => setQuizIndex(prev => prev + 1)}
                    className="px-4 py-2 rounded-lg bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700 shadow-xs"
                  >
                    下一題 →
                  </button>
                </div>
              )}
            </div>
          </div>
        );
      }

      // ==========================================
      // 模組 6: AddWordModal (新增字卡 Modal)
      // ==========================================
      function AddWordModal({ onClose, onAdd }) {
        const [word, setWord] = useState('');
        const [meaning, setMeaning] = useState('');
        const [partOfSpeech, setPartOfSpeech] = useState('noun');
        const [theme, setTheme] = useState('School & Study');
        const [example, setExample] = useState('');

        const handleSubmit = (e) => {
          e.preventDefault();
          if (!word || !meaning) return;

          const newVocab = {
            id: `v_custom_${Date.now()}`,
            word,
            phonetic: '/custom/',
            syllables: word,
            partOfSpeech,
            theme,
            rootBreakdown: '自訂學習單字',
            meaning,
            example: example || 'Custom user example sentence.',
            translation: '自訂造句翻譯。'
          };

          onAdd(newVocab);
          onClose();
        };

        return (
          <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-xl border border-slate-200">
              <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 className="font-bold text-slate-900 text-lg">新增自訂單字卡</h3>
                <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
                  <i data-lucide="x" className="w-5 h-5"></i>
                </button>
              </div>

              <form onSubmit={handleSubmit} className="space-y-3 text-sm">
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">英文單字</label>
                  <input
                    type="text"
                    required
                    value={word}
                    onChange={(e) => setWord(e.target.value)}
                    placeholder="例如：resilient"
                    className="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">中文意思</label>
                  <input
                    type="text"
                    required
                    value={meaning}
                    onChange={(e) => setMeaning(e.target.value)}
                    placeholder="例如：有適應力的"
                    className="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  />
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">詞性</label>
                    <select
                      value={partOfSpeech}
                      onChange={(e) => setPartOfSpeech(e.target.value)}
                      className="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                      <option value="noun">noun (n.)</option>
                      <option value="verb">verb (v.)</option>
                      <option value="adjective">adjective (adj.)</option>
                      <option value="adverb">adverb (adv.)</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">歸屬主題</label>
                    <select
                      value={theme}
                      onChange={(e) => setTheme(e.target.value)}
                      className="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                      <option value="School & Study">School & Study</option>
                      <option value="Environment & Nature">Environment & Nature</option>
                      <option value="Emotion & Feeling">Emotion & Feeling</option>
                      <option value="Business & Work">Business & Work</option>
                      <option value="Tech & Innovation">Tech & Innovation</option>
                      <option value="Daily & Health">Daily & Health</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">情境例句 (選填)</label>
                  <textarea
                    rows="2"
                    value={example}
                    onChange={(e) => setExample(e.target.value)}
                    placeholder="輸入包含該單字的練習英文例句..."
                    className="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  />
                </div>

                <div className="pt-3 flex justify-end space-x-2 border-t border-slate-100">
                  <button
                    type="button"
                    onClick={onClose}
                    className="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 text-xs font-semibold hover:bg-slate-200"
                  >
                    取消
                  </button>
                  <button
                    type="submit"
                    className="px-4 py-2 rounded-lg bg-indigo-600 text-white text-xs font-semibold hover:bg-indigo-700 shadow-xs"
                  >
                    確認儲存
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
