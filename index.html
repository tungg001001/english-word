<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VocabMaster - 英文單字學習大師</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & React DOM (v18) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel for browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons UMD Bundle -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // Lucide Helper Component
      const LucideIcon = ({ name, className = "w-4 h-4" }) => {
        useEffect(() => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        }, [name]);
        return <i data-lucide={name} className={className}></i>;
      };

      // ==========================================
      // 1. 核心單字資料庫
      // ==========================================
      const INITIAL_VOCABULARY = [
        {
          id: 'v1',
          word: 'combine',
          phonetic: '/kəmˈbaɪn/',
          syllables: 'com · bine',
          partOfSpeech: 'verb',
          theme: 'School & Study',
          rootBreakdown: 'com- (共同/一起) + bine (結合)',
          meaning: '結合、混合',
          example: 'We can combine practice with theory for better memory.',
          translation: '我們可以將練習與理論結合以達到更好的記憶效果。',
          synonyms: ['merge', 'unite', 'integrate'],
          antonyms: ['separate', 'divide']
        },
        {
          id: 'v2',
          word: 'complete',
          phonetic: '/kəmˈpliːt/',
          syllables: 'com · plete',
          partOfSpeech: 'adj / v',
          theme: 'School & Study',
          rootBreakdown: 'com- (完全) + plete (填滿)',
          meaning: '完整的；完成',
          example: 'Please complete the vocabulary quiz after reading.',
          translation: '請在閱讀後完成單字測驗。',
          synonyms: ['finish', 'fulfill'],
          antonyms: ['incomplete']
        },
        {
          id: 'v3',
          word: 'environment',
          phonetic: '/ɪnˈvaɪ.rən.mənt/',
          syllables: 'en · vi · ron · ment',
          partOfSpeech: 'noun',
          theme: 'Environment & Nature',
          rootBreakdown: 'environ (環繞) + -ment (名詞)',
          meaning: '環境、周圍狀況',
          example: 'A good learning environment accelerates memory retention.',
          translation: '良好的學習環境能加速記憶保持。',
          synonyms: ['surroundings', 'ecosystem'],
          antonyms: ['isolation']
        },
        {
          id: 'v4',
          word: 'beautiful',
          phonetic: '/ˈbjuː.tɪ.fəl/',
          syllables: 'beau · ti · ful',
          partOfSpeech: 'adjective',
          theme: 'Emotion & Feeling',
          rootBreakdown: 'beauty (美) + -ful (充滿)',
          meaning: '美麗的、漂亮的',
          example: 'She wrote a beautiful story based on her memory.',
          translation: '她根據回憶寫了一個美麗的故事。',
          synonyms: ['gorgeous', 'stunning', 'pretty'],
          antonyms: ['ugly', 'awkward']
        }
      ];

      // ==========================================
      // 2. 部首與小技巧資料庫
      // ==========================================
      const PREFIXES_SUFFIXES = {
        prefixes: [
          { affix: 'com-', meaning: '一起、共同', example: 'combine, complete, company' },
          { affix: 'dis-', meaning: '相反、遠離', example: 'disappear, discover, dishonest' },
          { affix: 'sub-', meaning: '在...下方', example: 'subway, submarine, suburb' }
        ],
        suffixes: [
          { affix: '-able', meaning: '有能力、可...', example: 'available, valuable, fashionable' },
          { affix: '-ful', meaning: '充滿...', example: 'beautiful, painful, peaceful' },
          { affix: '-ment', meaning: '行為、狀態', example: 'environment, government, movement' }
        ]
      };

      // ==========================================
      // 主應用程式 Component
      // ==========================================
      function App() {
        const [activeTab, setActiveTab] = useState('flashcards');
        const [vocabulary, setVocabulary] = useState(INITIAL_VOCABULARY);
        const [currentIndex, setCurrentIndex] = useState(0);
        const [isFlipped, setIsFlipped] = useState(false);

        const currentWord = vocabulary[currentIndex] || vocabulary[0];

        const speak = (text) => {
          if ('speechSynthesis' in window) {
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            window.speechSynthesis.speak(u);
          }
        };

        return (
          <div className="min-h-screen bg-slate-50 text-slate-800">
            {/* 導覽列 */}
            <header className="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200">
              <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
                <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('flashcards')}>
                  <div className="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold">
                    V
                  </div>
                  <h1 className="font-bold text-lg text-slate-900">VocabMaster 英文單字大師</h1>
                </div>

                <nav className="flex space-x-2">
                  <button
                    onClick={() => setActiveTab('flashcards')}
                    className={`px-3 py-1.5 rounded-lg text-sm font-medium ${activeTab === 'flashcards' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-600 hover:bg-slate-100'}`}
                  >
                    單字卡
                  </button>
                  <button
                    onClick={() => setActiveTab('prefixes')}
                    className={`px-3 py-1.5 rounded-lg text-sm font-medium ${activeTab === 'prefixes' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-600 hover:bg-slate-100'}`}
                  >
                    字首字尾部首
                  </button>
                </nav>
              </div>
            </header>

            {/* 內容區域 */}
            <main className="max-w-4xl mx-auto px-4 py-8">
              {activeTab === 'flashcards' ? (
                <div className="space-y-6">
                  <div className="bg-white rounded-2xl border border-slate-200 p-8 min-h-[320px] shadow-sm flex flex-col justify-between cursor-pointer" onClick={() => setIsFlipped(!isFlipped)}>
                    <div className="flex justify-between items-center">
                      <span className="px-2.5 py-1 bg-indigo-50 text-indigo-600 text-xs rounded-full font-semibold">
                        {currentWord.partOfSpeech}
                      </span>
                      <button
                        onClick={(e) => { e.stopPropagation(); speak(currentWord.word); }}
                        className="p-2 rounded-full bg-slate-100 text-slate-600 hover:bg-indigo-50 hover:text-indigo-600"
                      >
                        🔊
                      </button>
                    </div>

                    {!isFlipped ? (
                      <div className="text-center py-8 space-y-2">
                        <h2 className="text-4xl font-extrabold text-slate-900">{currentWord.word}</h2>
                        <p className="text-sm font-mono text-slate-400">{currentWord.phonetic}</p>
                        <p className="text-xs text-indigo-500 font-medium pt-2">點擊翻面查看字義</p>
                      </div>
                    ) : (
                      <div className="py-4 space-y-3">
                        <p className="text-2xl font-bold text-slate-900">{currentWord.meaning}</p>
                        <p className="text-xs text-indigo-600 font-semibold">字根：{currentWord.rootBreakdown}</p>
                        <p className="text-sm text-slate-700">{currentWord.example}</p>
                        <p className="text-xs text-slate-500">{currentWord.translation}</p>
                      </div>
                    )}

                    <div className="text-xs text-slate-400 text-center pt-4 border-t border-slate-100">
                      單字 {currentIndex + 1} / {vocabulary.length}
                    </div>
                  </div>

                  <div className="flex justify-between items-center">
                    <button
                      onClick={() => { setIsFlipped(false); setCurrentIndex((prev) => (prev - 1 + vocabulary.length) % vocabulary.length); }}
                      className="px-4 py-2 bg-white border rounded-lg text-sm font-medium hover:bg-slate-50"
                    >
                      上一張
                    </button>
                    <button
                      onClick={() => { setIsFlipped(false); setCurrentIndex((prev) => (prev + 1) % vocabulary.length); }}
                      className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700"
                    >
                      下一張
                    </button>
                  </div>
                </div>
              ) : (
                <div className="bg-white rounded-2xl border border-slate-200 p-6 space-y-6">
                  <h3 className="font-bold text-lg text-slate-900">常見字首字尾部首清單</h3>
                  <div className="space-y-4">
                    <div>
                      <h4 className="font-semibold text-indigo-600 text-sm mb-2">字首 Prefix</h4>
                      <div className="divide-y divide-slate-100 border rounded-xl overflow-hidden text-sm">
                        {PREFIXES_SUFFIXES.prefixes.map((p, i) => (
                          <div key={i} className="p-3 flex justify-between bg-white">
                            <span className="font-mono font-bold text-indigo-600">{p.affix}</span>
                            <span className="text-slate-700">{p.meaning}</span>
                            <span className="text-slate-400 text-xs">{p.example}</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div>
                      <h4 className="font-semibold text-indigo-600 text-sm mb-2">字尾 Suffix</h4>
                      <div className="divide-y divide-slate-100 border rounded-xl overflow-hidden text-sm">
                        {PREFIXES_SUFFIXES.suffixes.map((s, i) => (
                          <div key={i} className="p-3 flex justify-between bg-white">
                            <span className="font-mono font-bold text-indigo-600">{s.affix}</span>
                            <span className="text-slate-700">{s.meaning}</span>
                            <span className="text-slate-400 text-xs">{s.example}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
